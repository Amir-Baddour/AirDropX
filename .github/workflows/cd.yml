name: CD

# Starts automatically after CI succeeds on main.
# Build the API and frontend images once, deploy them to production, health-check it, roll back automatically if it fails.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false # never cancel a deploy halfway

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image to GHCR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ steps.meta.outputs.image }}-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  production:
    name: Deploy to production
    needs: image
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production # add a Required reviewer on this environment to get a manual approval step
      image: ${{ needs.image.outputs.image }}
      tag: ${{ needs.image.outputs.tag }}
      health_url: https://64-23-156-149.sslip.io/health
    secrets: inherit
